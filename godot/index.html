<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Classroom Story</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070914}
body{display:flex;align-items:center;justify-content:center}
#canvas{display:block;width:100vw;height:100vh;background:#070914;outline:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#070914;color:#fff;font:600 15px system-ui;z-index:10}
#loading.hidden{display:none}
#status{opacity:.8;margin-top:8px;font-weight:400;font-size:12px;text-align:center}
</style>
</head>
<body>
<div id="loading"><div>Memuat Classroom Story<div id="status">0%</div></div></div>
<canvas id="canvas" tabindex="0"></canvas>
<script src="classroom_story.js"></script>
<script>
(() => {
  const loading = document.getElementById('loading');
  const status = document.getElementById('status');
  const canvas = document.getElementById('canvas');
  const engine = new Engine({
    executable: 'classroom_story',
    mainPack: 'classroom_story.pck',
    canvas: canvas,
    canvasResizePolicy: 2,
    focusCanvas: true,
    args: []
  });
  engine.startGame({
    onProgress: (current, total) => {
      if (total > 0) status.textContent = `${Math.round(current / total * 100)}%`;
    }
  }).then(() => {
    loading.classList.add('hidden');
    canvas.focus();
    window.parent.postMessage({type:'classroom-story-ready'}, '*');
  }).catch((err) => {
    console.error(err);
    status.textContent = 'Gagal memuat game. Cek Console browser.';
  });
})();
</script>
</body>
</html>
